name: Publish presentation PDF

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PDF_FILE: dist/securing-ai-agents-across-voice-and-web.pdf
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Export PDF
        run: npm run export:pdf

      - name: Save PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: presentation-pdf
          path: ${{ env.PDF_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish default-branch release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping release: a newer commit is already on the default branch."
            exit 0
          fi

          tag="slides-${GITHUB_SHA:0:12}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$PDF_FILE" --clobber
          else
            gh release create "$tag" "$PDF_FILE" \
              --target "$GITHUB_SHA" \
              --title "Securing AI Agents - ${GITHUB_SHA:0:7}" \
              --notes "PDF presentation exported from commit $GITHUB_SHA." \
              --latest
          fi
